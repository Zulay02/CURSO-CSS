<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica: Unidades CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Unidades CSS Modernas</h1>

    <!-- COMPARARACION DE UNIDADES -->
    <div class="container">

        <!-- PX: FIJO-->
         <div class="box box-px">
            <h2>PX (200px) </h2>
            <p>Tamaño fijo</p>
         </div>
        <!-- %: RELATIVO AL PADRE-->
         <div class="box box-percent">
            <h2>% (50%)</h2>
            <p>Mitad del padre</p>
         </div>

        <!-- REM: RELATIVO AL ROOT -->
         <div class="box box-rem">
            <h2>Rem (15rem)</h2>
            <p>Relativo al html</p>
         </div>

        <!-- EM: RELATIVO AL ELEMENTO -->
         <div class="box box-em">
            <h2>Em (10em)</h2>
            <P>Relativo al padre</P>
         </div>

        <!-- VW: VIEWPORT WIDTH -->
         <div class="box box-vw">
            <h2>VW</h2>
            <P>30% del ancho de ventana</P>
         </div>

        <!-- VH: VIEWPORT HEIGHT -->
         <div class="box box-vh">
            <h2>VH</h2>
            <p>Altura: 20vh</p>
         </div>

    </div>
</body>
</html>
