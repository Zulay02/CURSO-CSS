<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-clase y Pseudo-elementos</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!--PSEUDO-CLASES -->
    <h2> Pseudo-clases</h2>

    <!-- :hovern -->
     <button>Hover me</button>

    <!-- :focus -->
    <input type="text" placeholder="Click me">

    <!-- :first-child, :last-child-->
    <ul>
    <li>Primer item</li>
    <li>Segundo item</li>
    <li>Tercer item</li>
    <li>último item</li>
    </ul>

    <!-- :nth-child -->
    <table>
        <tr>
            <td>Fila 1</td>
        </tr>
        <tr>
            <td>Fila 2</td>
        </tr>
        <tr>
            <td>Fila 3</td>
        </tr>
        <tr>
            <td>Fila 4</td>
        </tr>
    </table>

    <!-- PSEUDO ELEMENTOS-->
    <h2>Pseudo-elementos</h2>

    <!-- ::before y after-->
    <p class="quote">Texto con comillas</p>

    <!-- ::first-letter -->
    <p>Loren ipsum dolor sit amet consectetur</p>

    <!-- ::first-line-->
    <p>Primera línea destacada. Loren ipsum dolor  sit amet consectetur adipisicing elit.</p>
</body>

</html>
